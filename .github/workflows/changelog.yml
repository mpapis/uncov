name: Changelog

on:
  workflow_call:
    outputs:
      changelog:
        description: "The generated changelog content"
        value: ${{ jobs.changelog.outputs.changelog }}
      current_version:
        description: "The current version"
        value: ${{ jobs.changelog.outputs.current_version }}
      new_version:
        description: "The new version"
        value: ${{ jobs.changelog.outputs.new_version }}
      version_bump:
        description: "The version bump type (major, minor, patch)"
        value: ${{ jobs.changelog.outputs.version_bump }}
      releasable:
        description: "Whether there are releasable changes"
        value: ${{ jobs.changelog.outputs.releasable }}
  workflow_dispatch:
  push:
    branches: ['develop']

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
      current_version: ${{ steps.current_version.outputs.value }}
      version_bump: ${{ steps.version_bump.outputs.value }}
      new_version: ${{ steps.new_version.outputs.value }}
      releasable: ${{ steps.version_bump.outputs.found && steps.new_version.outputs.found }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Determine current version
        id: current_version
        run: |
          CURRENT_VERSION=$(ruby -e "require './lib/uncov/version'; puts Uncov::VERSION")
          echo "value=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configurationJson: |
            {
              "categories": [
                { "title": "### Major", "labels": ["release:breaking"] },
                { "title": "### Minor", "labels": ["release:feature"] },
                { "title": "### Patch", "labels": ["release:fix"] }
              ],
              "ignore_labels": ["release:ignore"],
              "pr_template": "- [##{{NUMBER}}](#{{URL}}): #{{TITLE}}, by [@#{{AUTHOR}}](https://github.com/#{{AUTHOR}})"
            }
          fromTag: "v${{ steps.current_version.outputs.value }}"
          toTag: "HEAD"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect version bump
        uses: ./.github/actions/detect_version_bump
        id: version_bump
        with:
          changelog: ${{ steps.changelog.outputs.changelog }}

      - name: New version
        if: ${{ steps.version_bump.outputs.found }}
        id: new_version
        uses: ./.github/actions/new_version
        with:
          bump_version: ${{ steps.version_bump.outputs.value }}

      - name: Add job summary - changelog
        if: ${{ steps.version_bump.outputs.found }}
        run: |
          echo -e '## Current version: ${{ steps.current_version.outputs.value }}\n\n' > $GITHUB_STEP_SUMMARY
          echo -e '## Version bump: ${{ steps.version_bump.outputs.value }}\n\n' >> $GITHUB_STEP_SUMMARY
          echo -e '## New version: ${{ steps.new_version.outputs.value }}\n\n' >> $GITHUB_STEP_SUMMARY
          echo -e '## Releasable: ${{ steps.version_bump.outputs.found && steps.new_version.outputs.found }}\n\n' >> $GITHUB_STEP_SUMMARY
          echo -e '# Changelog\n${{ steps.changelog.outputs.changelog }}' >> $GITHUB_STEP_SUMMARY


      - name: Add job summary - no changes
        if: ${{ !steps.version_bump.outputs.found }}
        run: |
          echo -e '# No changes' > $GITHUB_STEP_SUMMARY
